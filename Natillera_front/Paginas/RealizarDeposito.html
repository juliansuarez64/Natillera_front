<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>REALIZAR DEPÓSITO</title>
    <!-- Google Font: Source Sans Pro -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link href="Estilos/css/all.min.css" rel="stylesheet" />
    <link href="Estilos/adminlte.min.css" rel="stylesheet" />
    <link href="Estilos/dataTables.min.css" rel="stylesheet" />
    <link href="Estilos/dataTables.bootstrap4.min.css" rel="stylesheet" />
</head>
<body class="hold-transition sidebar-mini">
    <section class="content">
        <div class="container-fluid">
            <div class="row">
                <div class="col-md-12" id="dvMenu"></div>
                <div class="col-md-12">
                    <div class="card card-primary">
                        <div class="card-header">
                            <h3 class="card-title">REALIZAR DEPÓSITO</h3>
                        </div>
                        <form id="frmDeposito">
                            <div class="card-body">
                                <div class="card card-gray-dark">
                                    <div class="card-header">
                                        <h3 class="card-title">REALIZAR DEPÓSITO</h3>
                                    </div>
                                    <div class="card-body">
                                        <div class="row">
                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="txtAhorro">ID DE AHORRO</label>
                                                    <input type="text" class="form-control" id="txtAhorro" placeholder="ID de ahorro">
                                                </div>
                                            </div>
                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="txtMonto">MONTO</label>
                                                    <input type="text" class="form-control" id="txtMontoMensual" placeholder="Monto del depósito">
                                                </div>
                                            </div>
                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="txtFecha">FECHA</label>
                                                    <input type="date" class="form-control" id="txtFecha" placeholder="Fecha del depósito">
                                                </div>
                                            </div>
                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="cmbCliente">CLIENTE</label>
                                                    <select class="form-control" id="cmbCliente">
                                                        <option value="">Seleccione un cliente</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-md-3">
                                                <button type="button" class="btn btn-primary btn-block" id="btnRealizarDeposito">REALIZAR DEPÓSITO</button>
                                            </div>
                                            <div class="col-md-3">
                                                <button type="button" class="btn btn-secondary btn-block" onclick="ConsultarAho()">CONSULTAR</button>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="row">
                                                <div class="col-md-12">
                                                    <table id="tblAhorros" class="table table-bordered table-striped" style="width:100%;">
                                                        <thead>
                                                            <tr>
                                                                <th>ID Ahorro</th>
                                                                <th>Cliente ID</th>
                                                                <th>Monto Mensual</th>
                                                                <th>Fecha Inicial</th>
                                                            </tr>
                                                        </thead>
                                                    </table>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="card-footer">
                                            <div id="dvMensaje"></div>
                                        </div>
                                    </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="../Scripts/jquery-3.7.1.min.js"></script>
    <script src="../Scripts/bootstrap.bundle.min.js"></script>
    <!-- Tables -->
    <script src="../Scripts/jquery.dataTables.min.js"></script>
    <script src="../Scripts/dataTables.bootstrap4.min.js"></script>
    <!-- Archivos comunes -->
    <script src="Scripts/Comunes/Menu.js"></script>
    <script src="Scripts/Comunes/CRUD.js"></script>
    <script src="Scripts/Deposito.js"></script>
</body>
</html>
